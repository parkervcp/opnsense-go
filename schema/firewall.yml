        - name: CategoryNames
          type: SelectedMapList
          key: '%category'
        - name: Categories
          type: SelectedMapList
          key: categories
        - name: Description
          type: string
          key: descr
        - name: SetTag
          type: string
          key: tag
        - name: MatchTag
          type: string
          key: tagged
        - name: NoXMLRPCSync
          type: string
