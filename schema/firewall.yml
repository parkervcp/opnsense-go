---
name: firewall
reconfigureEndpoint: "" # Controller-wide reconfigure endpoint (can be overwritten)
resources:
  - name: Shared
    filename: shared
    readOnly: true
    endpoints:
      reconfigure: "null"
    customTypes:
      RuleCategoryColors:
        - name: Color
          type: string
          key: color
        - name: Name
          type: string
          key: name
        - name: UUID
          type: string
          key: uuid
      RuleAliasMeta:
        - name: Value
          type: string
          key: value
        - name: Name
          type: string
          key: '%value'
        - name: IsAlias
          type: bool
          key: isAlias
        - name: Description
          type: string
          key: description
        - name: Summary
          type: string
          key: summary

  # os-firewall resources

  - name: Filter
    filename: filter
    monad: rule
    endpoints:
      add: "/firewall/filter/addRule"
      get: "/firewall/filter/getRule"
      update: "/firewall/filter/setRule"
      delete: "/firewall/filter/delRule"
      reconfigure: "/firewall/filter/apply"
    attrs:
      - name: UUID
        type: string
        key: uuid
      - name: Enabled
        type: string
        key: enabled
      - name: SortOrder
        type: string
        key: sort_order
      - name: Sequence
        type: string
        key: sequence
      - name: Categories
        type: SelectedMapList
        key: categories
      - name: NoXMLRPCSync
        type: string
        key: nosync
      - name: Description
        type: string
        key: description
      - name: InvertInterface
        type: string
        key: interfacenot
      - name: Interface
        type: SelectedMapList
        key: interface
      - name: InterfaceNames
        type: SelectedMapList
        key: '%interface'
      - name: Quick
        type: string
        key: quick
      - name: Action
        type: SelectedMap
        key: action
      - name: AllowOptions
        type: string
        key: allowopts
      - name: Direction
        type: SelectedMap
        key: direction
      - name: IPProtocol
        type: SelectedMap
        key: ipprotocol
      - name: Protocol
        type: SelectedMap
        key: protocol
      - name: ICMPType
        type: SelectedMapList
        key: icmptype
      - name: ICMP6Type
        type: SelectedMapList
        key: icmp6type
      - name: SourceInvert
        type: string
        key: source_not
      - name: SourceNet
        type: string
        key: source_net
      - name: SourcePort
        type: string
        key: source_port
      - name: DestinationInvert
        type: string
        key: destination_not
      - name: DestinationNet
        type: string
        key: destination_net
      - name: DestinationPort
        type: string
        key: destination_port
      - name: Log
        type: string
        key: log
      - name: TCPFlags
        type: SelectedMapList
        key: tcpflags1
      - name: TCPFlagsOutOf
        type: SelectedMapList
        key: tcpflags2
      - name: TCPFlagsAny
        type: string
        key: tcpflags_any
      - name: Schedule
        type: SelectedMap
        key: sched
      - name: StateType
        type: SelectedMap
        key: statetype
      - name: StatePolicy
        type: SelectedMap
        key: state-policy
      - name: StateTimeout
        type: string
        key: statetimeout
      - name: AdaptiveTimeoutsStart
        type: string
        key: adaptivestart
      - name: AdaptiveTimeoutsEnd
        type: string
        key: adaptiveend
      - name: MaxStates
        type: string
        key: max
      - name: MaxSourceNodes
        type: string
        key: max-src-nodes
      - name: MaxSourceStates
        type: string
        key: max-src-states
      - name: MaxSourceConnections
        type: string
        key: max-src-conn
      - name: MaxNewConnectionsCount
        type: string
        key: max-src-conn-rate
      - name: MaxNewConnectionsSeconds
        type: string
        key: max-src-conn-rates
      - name: OverloadTable
        type: SelectedMap
        key: overload
      - name: NoPfsync
        type: string
        key: nopfsync
      - name: TrafficShaper
        type: SelectedMap
        key: shaper1
      - name: TrafficShaperReverse
        type: SelectedMap
        key: shaper2
      - name: Gateway
        type: SelectedMap
        key: gateway
      - name: DisableReplyTo
        type: string
        key: disablereplyto
      - name: ReplyTo
        type: SelectedMap
        key: replyto
      - name: MatchPriority
        type: SelectedMap
        key: prio
      - name: PriorityGroup
        type: string
        key: prio_group
      - name: SetPriority
        type: SelectedMap
        key: set-prio
      - name: SetPriorityLowDelay
        type: SelectedMap
        key: set-prio-low
      - name: MatchTOS
        type: SelectedMap
        key: tos
      - name: SetLocalTag
        type: string
        key: tag
      - name: MatchLocalTag
        type: string
        key: tagged

  - name: NAT
    filename: nat
    monad: rule
    endpoints:
      add: "/firewall/source_nat/addRule"
      get: "/firewall/source_nat/getRule"
      update: "/firewall/source_nat/setRule"
      delete: "/firewall/source_nat/delRule"
      reconfigure: "/firewall/source_nat/apply"
    attrs:
      - name: Enabled
        type: string
        key: enabled
      - name: DisableNAT
        type: string
        key: nonat
      - name: Sequence
        type: string
        key: sequence
      - name: Interface
        type: SelectedMap
        key: interface
      - name: IPProtocol
        type: SelectedMap
        key: ipprotocol
      - name: Protocol
        type: SelectedMap
        key: protocol
      - name: SourceNet
        type: string
        key: source_net
      - name: SourcePort
        type: string
        key: source_port
      - name: SourceInvert
        type: string
        key: source_not
      - name: DestinationNet
        type: string
        key: destination_net
      - name: DestinationPort
        type: string
        key: destination_port
      - name: DestinationInvert
        type: string
        key: destination_not
      - name: Target
        type: string
        key: target
      - name: TargetPort
        type: string
        key: target_port
      - name: Log
        type: string
        key: log
      - name: Description
        type: string
        key: description

  - name: DNAT
    filename: dnat
    monad: rule
    endpoints:
      add: "/firewall/d_nat/addRule"
      get: "/firewall/d_nat/getRule"
      update: "/firewall/d_nat/setRule"
      delete: "/firewall/d_nat/delRule"
      reconfigure: "/firewall/source_nat/apply"
    attrs:


  - name: NatOneToOne
    filename: nat_one_to_one
    monad: rule
    endpoints:
      add: "/firewall/one_to_one/addRule"
      get: "/firewall/one_to_one/getRule"
      update: "/firewall/one_to_one/setRule"
      delete: "/firewall/one_to_one/delRule"
      reconfigure: "/firewall/one_to_one/apply"
    attrs:
      - name: Enabled
        type: string
        key: enabled
      - name: Log
        type: string
        key: log
      - name: Sequence
        type: string
        key: sequence
      - name: Interface
        type: SelectedMap
        key: interface
      - name: Type
        type: SelectedMap
        key: type
      - name: SourceNet
        type: string
        key: source_net
      - name: SourceInvert
        type: string
        key: source_not
      - name: DestinationNet
        type: string
        key: destination_net
      - name: DestinationInvert
        type: string
        key: destination_not
      - name: ExternalNet
        type: string
        key: external
      - name: NatReflection
        type: SelectedMap
        key: natreflection
      - name: Categories
        type: SelectedMapList
        key: categories
      - name: Description
        type: string
        key: description
      

  # core firewall resources

  - name: Alias
    filename: alias
    monad: alias
    endpoints:
      add: "/firewall/alias/addItem"
      get: "/firewall/alias/getItem"
      update: "/firewall/alias/setItem"
      delete: "/firewall/alias/delItem"
      reconfigure: "/firewall/alias/reconfigure"
    attrs:
      - name: Enabled
        type: string
        key: enabled
      - name: Name
        type: string
        key: name
      - name: Type
        type: SelectedMap
        key: type
      - name: IPProtocol # only when type = asn, geoip, external
        type: SelectedMapList
        key: proto
      - name: Interface # only when type = dynipv6host
        type: SelectedMap
        key: interface
      - name: Content # NOT when type = external, ISO 3166-1 country code when type = geoip, __<int>_network when type = networkgroup, openvpn group when type = authgroup
        type: SelectedMapListNL
        key: content
      - name: Categories
        type: SelectedMapList
        key: categories
      - name: UpdateFreq # only when type = urltable
        type: string
        key: updatefreq
      - name: PathExpression # only when type = urljson
        type: string
        key: path_expression
      - name: Statistics # not when type = port
        type: string
        key: counters
      - name: Description
        type: string
        key: description

  - name: Category
    filename: category
    monad: category
    endpoints:
      add: "/firewall/category/addItem"
      get: "/firewall/category/getItem"
      update: "/firewall/category/setItem"
      delete: "/firewall/category/delItem"
      reconfigure: "null"
    attrs:
      - name: Automatic
        type: string
        key: auto
      - name: Name
        type: string
        key: name
      - name: Color
        type: string
        key: color

rpc:
  - name: "Rules"
    filename: rules
    customTypes:
      RulesInfoResponse:
        - name: Total
          type: int
          key: total
        - name: RowCount
          type: int
          key: rowCount
        - name: Current
          type: int
          key: current
        - name: Rules
          type: '[]RuleInfo'
          key: rows
      RuleInfo:
        - name: UUID
          type: string
          key: uuid
        - name: Enabled
          type: string
          key: enabled
        - name: StateType
          type: SelectedMap
          key: statetype
        - name: StateTypeName
          type: SelectedMap
          key: '%statetype'
        - name: StatePolicy
          type: SelectedMap
          key: state-policy
        - name: Sequence
          type: string
          key: sequence
        - name: SortOrder
          type: string
          key: sort_order
        - name: PriorityGroup
          type: string
          key: prio_group
        - name: Action
          type: SelectedMap
          key: action
        - name: Quick
          type: string
          key: quick
        - name: InvertInterface
          type: string
          key: interfacenot
        - name: Interface
          type: SelectedMapList
          key: interface
        - name: InterfaceName
          type: SelectedMapList
          key: '%interface'
        - name: Direction
          type: SelectedMap
          key: direction
        - name: DirectionName
          type: SelectedMap
          key: '%direction'
        - name: IPProtocol
          type: SelectedMap
          key: ipprotocol
        - name: IPProtocolName
          type: SelectedMap
          key: '%ipprotocol'
        - name: Protocol
          type: SelectedMap
          key: protocol
        - name: ICMPType
          type: SelectedMapList
          key: icmptype
        - name: ICMP6Type
          type: SelectedMapList
          key: icmp6type
        - name: SourceNet
          type: string
          key: source_net
        - name: SourceNetName
          type: string
          key: source_net
        - name: SourceInvert
          type: string
          key: source_not
        - name: SourcePort
          type: string
          key: source_port
        - name: DestinationNet
          type: string
          key: destination_net
        - name: DestinationInvert
          type: string
          key: destination_not
        - name: DestinationPort
          type: string
          key: destination_port
        - name: DivertTo
          type: string
          key: divert-to
        - name: DivertToName
          type: string
          key: '%divert-to'
        - name: Gateway
          type: SelectedMap
          key: gateway
        - name: ReplyTo
          type: SelectedMap
          key: replyto
        - name: DisableReplyTo
          type: string
          key: disablereplyto
        - name: Log
          type: string
          key: log
        - name: AllowOptions
          type: string
          key: allowopts
        - name: NoXMLRPCSync
          type: string
          key: nosync
        - name: NoPfsync
          type: string
          key: nopfsync
        - name: StateTimeout
          type: string
          key: statetimeout
        - name: UDPFirst
          type: string
          key: udp-first
        - name: UDPMultiple
          type: string
          key: udp-multiple
        - name: UDPSingle
          type: string
          key: udp-single
        - name: MaxSourceNodes
          type: string
          key: max-src-nodes
        - name: MaxSourceStates
          type: string
          key: max-src-states
        - name: MaxSourceConnections
          type: string
          key: max-src-conn
        - name: MaxStates
          type: string
          key: max
        - name: MaxNewConnectionsCount
          type: string
          key: max-src-conn-rate
        - name: MaxNewConnectionsSeconds
          type: string
          key: max-src-conn-rates
        - name: OverloadTable
          type: SelectedMap
          key: overload
        - name: AdaptiveTimeoutsStart
          type: string
          key: adaptivestart
        - name: AdaptiveTimeoutsEnd
          type: string
          key: adaptiveend
        - name: MatchPriority
          type: SelectedMap
          key: prio
        - name: SetPriority
          type: SelectedMap
          key: set-prio
        - name: SetPriorityLowDelay
          type: SelectedMap
          key: set-prio-low
        - name: SetLocalTag
          type: string
          key: tag
        - name: MatchLocalTag
          type: string
          key: tagged
        - name: TCPFlags
          type: SelectedMapList
          key: tcpflags1
        - name: TCPFlagsOutOf
          type: SelectedMapList
          key: tcpflags2
        - name: TCPFlagsAny
          type: string
          key: tcpflags_any
        - name: Categories
          type: SelectedMapList
          key: categories
        - name: CategoriesNames
          type: SelectedMapList
          key: '%categories'
        - name: Schedule
          type: SelectedMap
          key: sched
        - name: MatchTOS
          type: SelectedMap
          key: tos
        - name: TrafficShaper
          type: SelectedMap
          key: shaper1
        - name: TrafficShaperReverse
          type: SelectedMap
          key: shaper2
        - name: Description
          type: string
