        - name: DestinationPortMeta
          type: '[]RuleAliasMeta'
          key: alias_meta_destination_port
        - name: CategoryColors
          type: '[]RuleCategoryColors'
          key: category_colors
    rpc_calls:
      - name: "Get"
        method: "GET"
        endpoint: "/firewall/filter/search_rule"
        result_type: "RulesInfoResponse"

  - name: "Categories"
    filename: categories
    customTypes:
      CategoriesResponse:
        - name: Total
          type: int
          key: total
        - name: RowCount
          type: int
          key: rowCount
        - name: Current
          type: int
          key: current
        - name: Categories
          type: '[]CategoryInfo'
          key: rows
      CategoryInfo:
        - name: UUID
          type: string
          key: uuid
        - name: Name
          type: string
          key: name
        - name: Auto
          type: string
          key: auto
        - name: Color
          type: string
          key: color
    rpc_calls:
      - name: "Get"
        method: "GET"
        endpoint: "/firewall/category/search_item"
        result_type: "CategoriesResponse"

  - name: "Aliases"
    filename: aliases
    customTypes:
      AliasesResponse:
        - name: Total
          type: int
